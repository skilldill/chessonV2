version: '3.8'

services:
  api:
    build: ./api
    container_name: chesson-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/chesson
      - STOCKFISH_PATH=/usr/games/stockfish
    depends_on:
      - mongodb
    networks:
      - app-network

  puzzle-generator:
    build: ./api
    container_name: chesson-puzzle-generator
    command: bun run puzzle-generator
    restart: "no"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/chesson
      - STOCKFISH_PATH=/usr/games/stockfish
      - PUZZLE_GENERATOR_LIMIT=${PUZZLE_GENERATOR_LIMIT:-50}
      - PUZZLE_GENERATOR_MOVE_TIME_MS=${PUZZLE_GENERATOR_MOVE_TIME_MS:-150}
      - PUZZLE_GENERATOR_MULTIPV=${PUZZLE_GENERATOR_MULTIPV:-3}
      - PUZZLE_GENERATOR_STALE_RUNNING_JOB_MS=${PUZZLE_GENERATOR_STALE_RUNNING_JOB_MS:-1800000}
      - PUZZLE_GENERATOR_STATUS=${PUZZLE_GENERATOR_STATUS:-draft}
    depends_on:
      - mongodb
    networks:
      - app-network

  fen-puzzle-generator:
    build: ./api
    container_name: chesson-fen-puzzle-generator
    command: bun run fen-puzzle-generator
    restart: "no"
    stdin_open: false
    tty: false
    environment:
      - STOCKFISH_PATH=/usr/games/stockfish
      - FEN_PUZZLE_INPUT_FILE=${FEN_PUZZLE_INPUT_FILE:-/app/fen-puzzles/input/fens.txt}
      - FEN_PUZZLE_OUTPUT_FILE=${FEN_PUZZLE_OUTPUT_FILE:-/app/fen-puzzles/output/puzzles.json}
      - FEN_PUZZLE_LIMIT=${FEN_PUZZLE_LIMIT:-50}
      - FEN_PUZZLE_MOVE_TIME_MS=${FEN_PUZZLE_MOVE_TIME_MS:-150}
      - FEN_PUZZLE_MULTIPV=${FEN_PUZZLE_MULTIPV:-3}
      - FEN_PUZZLE_STATUS=${FEN_PUZZLE_STATUS:-draft}
      - FEN_PUZZLE_ACCEPT_ANY_BEST_MOVE=${FEN_PUZZLE_ACCEPT_ANY_BEST_MOVE:-true}
      - FEN_PUZZLE_MIN_SOLUTION_PLIES=${FEN_PUZZLE_MIN_SOLUTION_PLIES:-1}
      - FEN_PUZZLE_MIN_FIRST_GAP_CP=${FEN_PUZZLE_MIN_FIRST_GAP_CP:-150}
      - FEN_PUZZLE_MIN_CONTINUATION_GAP_CP=${FEN_PUZZLE_MIN_CONTINUATION_GAP_CP:-60}
      - FEN_PUZZLE_MIN_ADVANTAGE_CP=${FEN_PUZZLE_MIN_ADVANTAGE_CP:-120}
    volumes:
      - ./fen-puzzles:/app/fen-puzzles
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
